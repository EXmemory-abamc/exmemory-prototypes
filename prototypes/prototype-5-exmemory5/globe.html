<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globe — EXmemory v5.0</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0c0a;--fg:#e8e8e2;--mid:#5a5a54;--red:#C0392B;--border:rgba(232,232,226,.1)}

body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;overflow:hidden;transition:background .5s,color .5s}
#canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:28px 36px;z-index:20;pointer-events:none}
nav a{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);text-decoration:none;pointer-events:all;transition:color .2s}
nav a:hover{color:var(--red)}
nav div{display:flex;align-items:center;gap:12px}

#hint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);opacity:.7;z-index:20;pointer-events:none;text-align:center;white-space:nowrap}
#cursor-dot{position:fixed;width:12px;height:12px;border-radius:50%;border:2px solid var(--red);background:transparent;pointer-events:none;z-index:100;opacity:0;transform:translate(-50%,-50%);transition:opacity .2s}
#fade-in{position:fixed;inset:0;z-index:9999;background:var(--bg);animation:fadeOut .8s ease-out forwards;pointer-events:none}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div id="fade-in"></div>
<canvas id="canvas"></canvas>
<nav>
  <a href="index.html">← Home</a>
  <div style="display:flex;align-items:center;gap:10px">
    <svg width="20" height="20" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#C0392B" stroke-width="4"/><circle cx="50" cy="50" r="18" fill="none" stroke="#C0392B" stroke-width="3"/><line x1="50" y1="5" x2="50" y2="95" stroke="#C0392B" stroke-width="2" opacity=".4"/><line x1="5" y1="50" x2="95" y2="50" stroke="#C0392B" stroke-width="2" opacity=".4"/></svg>
    <span style="font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--fg)">EXmemory</span>
    <span style="font-size:8px;font-weight:400;letter-spacing:.18em;color:var(--mid)">IMMERSIVE COLLECTIVE MEMORY</span>
  </div>
</nav>
<div id="hint">Clicca il punto rosso · Muovi il mouse per esplorare</div>
<div id="cursor-dot"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
// ================================================================
// Config
// ================================================================
const ITALY_POS = (() => {
  const lon = 13.29, lat = 42.63;
  const phi = ((lon + 180) / 360) * Math.PI * 2;
  const theta = (1 - (90 + lat) / 180) * Math.PI;
  return new THREE.Vector3(
    -Math.sin(theta) * Math.cos(phi),
    Math.cos(theta),
    Math.sin(theta) * Math.sin(phi)
  ).multiplyScalar(1.01);
})();

const darkMode = true;

// ================================================================
// Three.js setup
// ================================================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0c0c0a);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
const raycaster = new THREE.Raycaster();

// Camera orbital
let theta = 0.5, phi = 0.3, radius = 2.6;
let targetTheta = theta, targetPhi = phi;
let centerTheta = theta, centerPhi = phi;
let mouseX = 0, mouseY = 0;
let isDragging = false, dragStartX, dragStartY, dragStartTheta, dragStartPhi;

function updateCamera() {
  camera.position.x = radius * Math.sin(theta) * Math.cos(phi);
  camera.position.y = radius * Math.sin(phi);
  camera.position.z = radius * Math.cos(theta) * Math.cos(phi);
  camera.lookAt(0, 0, 0);
}

// ================================================================
// Build globe
// ================================================================
const loader = new THREE.TextureLoader();
let globeGroup = new THREE.Group();
let hotspotMeshes = [];
let pulseObjs = [];

function buildGlobe() {
  // Clear
  while (scene.children.length) scene.remove(scene.children[0]);
  globeGroup = new THREE.Group();
  hotspotMeshes = [];
  pulseObjs = [];

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 1.0);
  dir.position.set(5, 10, 7);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dir2.position.set(-5, -3, -5);
  scene.add(dir2);

  // Globe sphere
  const satTex = loader.load('https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg');
  const topoTex = loader.load('https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png');
  const geo = new THREE.SphereGeometry(1, 64, 64);
  const mat = new THREE.MeshPhongMaterial({
    map: satTex,
    bumpMap: topoTex,
    bumpScale: 0.03,
    specular: new THREE.Color(0x111111),
    shininess: 10
  });
  const globe = new THREE.Mesh(geo, mat);
  globeGroup.add(globe);

  // Atmosphere glow
  const glowMat = new THREE.MeshPhongMaterial({
    color: 0x88bbff,
    transparent: true,
    opacity: 0.12,
    side: THREE.BackSide
  });
  const glow = new THREE.Mesh(new THREE.SphereGeometry(1.03, 48, 48), glowMat);
  globeGroup.add(glow);

  // Italy hotspot
  const sphereGeo = new THREE.SphereGeometry(0.025, 16, 16);
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0xC0392B });
  const hotspot = new THREE.Mesh(sphereGeo, sphereMat);
  hotspot.position.copy(ITALY_POS);
  hotspot.userData = { type: 'italy' };
  globeGroup.add(hotspot);
  hotspotMeshes.push(hotspot);

  // Pulse ring
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xC0392B, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.035, 0.055, 24), ringMat);
  ring.position.copy(ITALY_POS);
  ring.lookAt(0, 0, 0);
  globeGroup.add(ring);
  pulseObjs.push({ mesh: ring });

  // Starfield
  const starGeo = new THREE.BufferGeometry();
  const starCount = 800;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 200;
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat2 = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8 });
  const stars = new THREE.Points(starGeo, starMat2);
  scene.add(stars);

  scene.add(globeGroup);
  updateCamera();
}



// ================================================================
// Controls — Parallax hover + drag orbit
// ================================================================
canvas.addEventListener('mousemove', e => {
  const ndcX = (e.clientX / innerWidth) * 2 - 1;
  const ndcY = -(e.clientY / innerHeight) * 2 + 1;

  if (isDragging) {
    theta = dragStartTheta - (e.clientX - dragStartX) * 0.005;
    phi = Math.max(-0.3, Math.min(1.3, dragStartPhi + (e.clientY - dragStartY) * 0.004));
    updateCamera();
  }

  // Parallax hover — camera smoothly drifts with mouse (only when not dragging)
  if (!isDragging) {
    targetTheta = centerTheta + ndcX * 0.25;
    targetPhi = centerPhi - ndcY * 0.15;
    targetPhi = Math.max(-0.3, Math.min(1.3, targetPhi));
  }

  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragStartTheta = theta;
  dragStartPhi = phi;
});
canvas.addEventListener('mouseup', () => { isDragging = false; targetTheta = theta; targetPhi = phi; centerTheta = theta; centerPhi = phi; });
canvas.addEventListener('mouseleave', () => { isDragging = false; targetTheta = theta; targetPhi = phi; centerTheta = theta; centerPhi = phi; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  radius = Math.max(1.5, Math.min(8, radius + e.deltaY * 0.005));
}, { passive: false });

// Click Italy hotspot
canvas.addEventListener('click', e => {
  const ndc = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(hotspotMeshes);
  if (hits.length && hits[0].object.userData.type === 'italy') {
    window.location.href = 'country.html';
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================================================================
// Animation
// ================================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  // Parallax smooth interpolation
  if (!isDragging) {
    theta += (targetTheta - theta) * 0.025;
    phi += (targetPhi - phi) * 0.025;
    updateCamera();
  }

  // Pulse rings
  const t = clock.getElapsedTime();
  pulseObjs.forEach(p => {
    const s = 1 + Math.sin(t * 2.5) * 0.2;
    p.mesh.scale.set(s, s, s);
    p.mesh.material.opacity = 0.3 + Math.sin(t * 2.2) * 0.15;
  });

  // Cursor dot
  const ndc = new THREE.Vector2((mouseX / innerWidth) * 2 - 1, -(mouseY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(hotspotMeshes);
  const cd = document.getElementById('cursor-dot');
  cd.style.opacity = hits.length ? '1' : '0';
  cd.style.left = mouseX + 'px';
  cd.style.top = mouseY + 'px';

  renderer.render(scene, camera);
}

// ================================================================
// Init
// ================================================================
buildGlobe();
animate();
</script>
</body>
</html>
