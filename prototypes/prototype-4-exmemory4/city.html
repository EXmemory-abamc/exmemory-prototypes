<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amatrice — EXmemory v4.0</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f8f5;--fg:#1a1a16;--mid:#8a8a82;--red:#C0392B;--border:rgba(26,26,22,.12)}
html.dark{--bg:#0c0c0a;--fg:#e8e8e2;--mid:#5a5a54;--red:#C0392B;--border:rgba(232,232,226,.1)}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;overflow:hidden;transition:background .5s,color .5s}
#canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:28px 36px;z-index:20;pointer-events:none}
nav a{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);text-decoration:none;pointer-events:all;transition:color .2s}
nav a:hover{color:var(--red)}
nav div{display:flex;align-items:center;gap:12px}
#theme-btn{background:none;border:1px solid var(--border);color:var(--fg);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:8px 16px;cursor:pointer;pointer-events:all;transition:all .2s}
#theme-btn:hover{background:var(--fg);color:var(--bg)}
#city-toggle{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:22;display:none;gap:6px;pointer-events:all}
#city-toggle .ui-btn{background:none;border:1px solid var(--border);color:var(--mid);font-family:'DM Sans',sans-serif;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;cursor:pointer;transition:all .2s}
#city-toggle .ui-btn:hover{color:var(--fg)}
#city-toggle .active-btn{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#hint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);opacity:.7;z-index:20;pointer-events:none;text-align:center;white-space:nowrap}
#cursor-dot{position:fixed;width:10px;height:10px;border-radius:50%;border:2px solid var(--red);background:transparent;pointer-events:none;z-index:100;opacity:0;transform:translate(-50%,-50%);transition:opacity .2s,transform .15s}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<nav>
  <a href="country.html">← Italia</a>
  <div>
    <button id="theme-btn">◐ Tema</button>
  </div>
</nav>
<div id="city-toggle">
  <button class="ui-btn active-btn" id="pre-btn">Pre 2016</button>
  <button class="ui-btn" id="post-btn">Post 24 Ago</button>
</div>
<div id="hint">Clicca l'edificio rosso · Trascina per orbitare · Scorri per zoomare</div>
<div id="cursor-dot"></div>
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script>
const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.polygonOffset=true;renderer.polygonOffsetFactor=-1;renderer.polygonOffsetUnits=-1;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,500);
const clock=new THREE.Clock();
const raycaster=new THREE.Raycaster();

let darkMode=localStorage.getItem('exm_theme')==='dark';
let sceneObjs=[],hotspotMeshes=[],pulseObjs=[];
let cityState='pre';
let isDragging=false,dragStart={x:0,y:0};
let orbitTheta=.76,orbitPhi=-.58,orbitDist=17,orbitTarget=new THREE.Vector3(0,1,0);
let mousePx=new THREE.Vector2(),hovering=false;

const C={
  bg:()=>darkMode?0x0c0c0a:0xf8f8f5,
  land:()=>darkMode?0x282826:0xb8b8b2,
  sea:()=>darkMode?0x0f0f0d:0xe8e8e2,
  mid:()=>darkMode?0x444440:0x999990,
  wall:()=>darkMode?0x1e1c1a:0xe4e0da,
};
const CITY_PRE_TEX='uploads/2A.jpg';
const CITY_POST_TEX='uploads/2B.jpg';
const EXMEMORY_MARKERS=[
  {h:4,x:-5,z:-3,room:0,label:'Casa Rossa'},
  {h:4,x:6,z:2,room:1,label:'Municipio'},
  {h:4,x:-8,z:5,room:2,label:'Scuola Elementare'},
];

function loadTextureSafe(url,fallbackColor,onLoad){
  const fc=document.createElement('canvas');fc.width=2;fc.height=2;
  fc.getContext('2d').fillStyle=fallbackColor;fc.getContext('2d').fillRect(0,0,2,2);
  const loader=new THREE.TextureLoader();
  const tex=loader.load(url,onLoad,undefined,()=>{tex.image=fc;tex.needsUpdate=true;if(onLoad)onLoad()});
  return tex;
}
function applyTheme(){
  document.documentElement.classList.toggle('dark',darkMode);
  renderer.setClearColor(C.bg());
}
applyTheme();

function updateOrbitCamera(){
  const d=orbitTarget.clone().add(new THREE.Vector3(
    -orbitDist*Math.cos(orbitPhi)*Math.sin(orbitTheta),
    orbitDist*Math.sin(orbitPhi),
    -orbitDist*Math.cos(orbitPhi)*Math.cos(orbitTheta)
  ));
  camera.position.copy(d);
  camera.lookAt(orbitTarget);
}

function setupLights(){
  const a=new THREE.AmbientLight(darkMode?0x1a1a1a:0x444444,.6);scene.add(a);sceneObjs.push(a);
  const s=new THREE.DirectionalLight(0xffeedd,1.2);s.position.set(5,12,8);scene.add(s);sceneObjs.push(s);
  const h=new THREE.DirectionalLight(0xaaccff,.4);h.position.set(-3,6,-5);scene.add(h);sceneObjs.push(h);
}

function clearScene(){
  while(scene.children.length)scene.remove(scene.children[0]);
  sceneObjs=[];hotspotMeshes=[];pulseObjs=[];
  orbitTarget.set(0,1,0);
}

function add(mesh){scene.add(mesh);sceneObjs.push(mesh);return mesh}

function addPulseRing(position){
  const mat=new THREE.MeshBasicMaterial({color:0xC0392B,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false});
  const ring=new THREE.Mesh(new THREE.RingGeometry(.12,.18,32),mat);
  ring.position.copy(position);ring.position.y+=.15;ring.rotation.x=Math.PI/2;
  scene.add(ring);sceneObjs.push(ring);pulseObjs.push({mesh:ring});
}

function buildCity(){
  clearScene();setupLights();renderer.setClearColor(C.bg());
  const ct=document.getElementById('city-toggle');
  ct.style.display='flex';
  document.getElementById('pre-btn').classList.toggle('active-btn',cityState==='pre');
  document.getElementById('post-btn').classList.toggle('active-btn',cityState==='post');

  const post=cityState==='post';

  const gndTex=loadTextureSafe(post?CITY_POST_TEX:CITY_PRE_TEX,'#6a7a50',null);
  gndTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  const gndMat=new THREE.MeshStandardMaterial({map:gndTex,roughness:.9});
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(28,28),gndMat);
  gnd.position.y=-.005;gnd.rotation.x=-Math.PI/2;add(gnd);

  if(!post){
    const greenMat=new THREE.MeshStandardMaterial({color:darkMode?0x1e2a12:0x6a8a40,roughness:1});
    const darkGreen=new THREE.MeshStandardMaterial({color:darkMode?0x16200e:0x4a6828,roughness:1});
    [[-9,-5,5,6],[-8,6,4,5],[7,-6,5,5],[8,5,4,6],[-3,-9,6,3],[4,-8,5,3],[-2,9,5,3],[5,8,6,3]].forEach(([x,z,w,d])=>{
      const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),Math.random()>.5?greenMat:darkGreen);
      m.rotation.x=-Math.PI/2;m.position.set(x,.001,z);add(m);
    });
  }

  const roadCol=darkMode?0x2a2826:0xb8b2a8;
  const roadMat=new THREE.MeshStandardMaterial({color:roadCol,roughness:1});
  const road=(w,d,px,pz,ry=0)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),roadMat);
    m.rotation.x=-Math.PI/2;m.rotation.z=ry;m.position.set(px,.003,pz);add(m);
  };
  road(18,1.0,0,0);road(1.0,14,0,0);
  road(16,.8,0,3.8);road(16,.8,0,-3.8);
  road(.8,10,7.5,0);road(.8,10,-7.5,0);
  [-5,-2.5,0,2.5,5].forEach(x=>road(.7,10,x,0));
  [-2,-1,0,1,2].forEach(z=>road(18,.65,0,z));

  const tGroup=new THREE.Group();
  tGroup.rotation.y=0.22;
  scene.add(tGroup);sceneObjs.push(tGroup);

  const terra=[0xb05838,0xc06848,0xa84e30,0xb86040,0xc87050,0xd08060];
  const stoneWall=[0xc8b898,0xb8a888,0xd0c0a0,0xc0b090];
  const rubble=[0xe8e4dc,0xd8d4cc,0xf0ece4,0xdad6ce];

  const rowDefs=[
    [-3.0,-3.5,3.5,6,.85],[-2.15,-5.0,5.0,9,.82],[-1.35,-6.0,6.0,11,.80],
    [-0.55,-6.5,6.5,12,.80],[0.25,-6.5,6.5,12,.80],[1.05,-6.0,6.0,11,.80],
    [1.85,-5.0,5.0,9,.82],[2.65,-3.5,3.5,6,.85],
  ];
  rowDefs.forEach(([zc,xs,xe,n,depth])=>{
    const segW=(xe-xs)/n;
    for(let i=0;i<n;i++){
      const x=xs+(i+.5)*segW;
      const distFromCenter=Math.sqrt(x*x+zc*zc);
      const baseH=3.0-distFromCenter*.15+Math.sin(x*1.1+zc*.9)*.5+Math.random()*.4;
      const h=Math.max(.8,baseH);
      const destroyed=post&&distFromCenter<3.8&&Math.random()>.25;
      const partiallyDamaged=post&&distFromCenter<5&&!destroyed&&Math.random()>.5;
      const actualH=destroyed?(.1+Math.random()*.3):partiallyDamaged?h*.45:h;
      let col;
      if(destroyed)col=rubble[Math.floor(Math.random()*rubble.length)];
      else if(partiallyDamaged)col=darkMode?0x2a2624:0xd0c8bc;
      else col=darkMode?0x2e2824:stoneWall[Math.floor(Math.random()*stoneWall.length)];
      const geo=new THREE.BoxGeometry(segW*.92,actualH,depth);
      const mat=new THREE.MeshStandardMaterial({color:col,roughness:.9});
      const m=new THREE.Mesh(geo,mat);
      m.position.set(x,actualH/2,zc);
      if(partiallyDamaged&&post){m.rotation.z=(Math.random()-.5)*.15;m.rotation.x=(Math.random()-.5)*.06;}
      tGroup.add(m);sceneObjs.push(m);
      if(!destroyed){
        const roofCol=post&&partiallyDamaged?(darkMode?0x302820:0xb8a898):terra[Math.floor(Math.random()*terra.length)];
        const rh=.12+Math.random()*.08;
        const roof=new THREE.Mesh(new THREE.BoxGeometry(segW*.96,rh,depth+.05),new THREE.MeshStandardMaterial({color:roofCol,roughness:.85}));
        roof.position.set(x,actualH+rh/2,zc);
        tGroup.add(roof);sceneObjs.push(roof);
      }
      if(destroyed&&post){
        for(let r=0;r<4;r++){
          const s=.15+Math.random()*.3;
          const rb=new THREE.Mesh(new THREE.BoxGeometry(s,s*.25,s*.8),new THREE.MeshStandardMaterial({color:rubble[Math.floor(Math.random()*rubble.length)],roughness:1}));
          rb.position.set(x+(Math.random()-.5)*segW*1.5,.12+s*.12,zc+(Math.random()-.5)*depth*1.5);
          rb.rotation.y=Math.random()*Math.PI;
          tGroup.add(rb);sceneObjs.push(rb);
        }
      }
    }
  });

  const periph=[
    [-8,-2,1.4,1.2,2.2,false],[-8,1.5,1.2,1.0,2.0,false],
    [8,-1.5,2.0,1.5,3.5,false],[8,2,1.5,1.2,2.8,false],
    [0,-6,3.0,2.0,2.5,false],[-2,6.5,2.5,1.5,2.8,false],
    [3,6,2.0,1.8,2.2,false],[-6,-5.5,1.8,1.4,1.8,false],
    [5.5,-5,1.5,1.2,2.0,false],[3,1.8,.9,.7,2.2,true],
  ];
  periph.forEach(([x,z,w,d,h,isRed])=>{
    const destroyedP=post&&!isRed&&Math.abs(x)<6&&Math.abs(z)<6&&Math.random()>.5;
    const actualH2=destroyedP?.2:h;
    const col=isRed?0xC0392B:destroyedP?(darkMode?0x282420:0xd8d4cc):(darkMode?0x2e2824:stoneWall[0]);
    const geo=new THREE.BoxGeometry(w,actualH2,d);
    const mat=new THREE.MeshStandardMaterial({color:col,roughness:.9,emissive:isRed?0xC0392B:0,emissiveIntensity:isRed?.25:0});
    const m=new THREE.Mesh(geo,mat);
    m.position.set(x,actualH2/2,z);add(m);
    if(!isRed&&!destroyedP){
      const roofCol=terra[Math.floor(Math.random()*terra.length)];
      const rh=.12;
      const roof2=new THREE.Mesh(new THREE.BoxGeometry(w+.06,rh,d+.06),new THREE.MeshStandardMaterial({color:roofCol,roughness:.85}));
      roof2.position.set(x,actualH2+rh/2,z);add(roof2);
    }
    if(isRed)hotspotMeshes.push({mesh:m,action:()=>{window.location.href='room.html?id=0'},getWorldPos:()=>m.position.clone()});
  });

  const sc=.05;
  EXMEMORY_MARKERS.forEach(mk=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(3,3,3),new THREE.MeshStandardMaterial({color:0xC0392B,emissive:0xC0392B,emissiveIntensity:.3,roughness:.5}));
    m.position.set(mk.x*sc,mk.h/2*sc,mk.z*sc);
    add(m);
    const roomIdx=mk.room;
    hotspotMeshes.push({mesh:m,action:()=>{window.location.href='room.html?id='+roomIdx},getWorldPos:()=>m.position.clone()});
    const ringMat=new THREE.MeshBasicMaterial({color:0xC0392B,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false});
    const rng=new THREE.Mesh(new THREE.RingGeometry(.12,.18,32),ringMat);
    rng.position.copy(m.position);rng.position.y+=.15;rng.rotation.x=Math.PI/2;
    add(rng);pulseObjs.push({mesh:rng});
  });

  if(!post||(post&&Math.random()>.4)){
    const towerH=post?1.5:6.5;
    const tower=new THREE.Mesh(new THREE.BoxGeometry(.8,towerH,.8),new THREE.MeshStandardMaterial({color:darkMode?0x302c28:0xc8c0b0,roughness:.9}));
    tower.position.set(-1,towerH/2,-2.8);
    tGroup.add(tower);sceneObjs.push(tower);
    if(!post){
      const cap=new THREE.Mesh(new THREE.BoxGeometry(1.0,.4,1.0),new THREE.MeshStandardMaterial({color:darkMode?0x3a3028:0xa05030,roughness:.85}));
      cap.position.set(-1,towerH+.2,-2.8);tGroup.add(cap);sceneObjs.push(cap);
    }
  }
  if(post){
    const rg=new THREE.Mesh(new THREE.PlaneGeometry(13,7.5),new THREE.MeshStandardMaterial({color:darkMode?0x2a2824:0xe0dcd4,roughness:1}));
    rg.rotation.x=-Math.PI/2;rg.rotation.z=.22;rg.position.set(0,.001,0);add(rg);
  }
  orbitTarget.set(0,1,0);
  orbitTheta=.76;orbitPhi=-.58;orbitDist=17;
  updateOrbitCamera();
}

document.getElementById('pre-btn').addEventListener('click',()=>{cityState='pre';buildCity()});
document.getElementById('post-btn').addEventListener('click',()=>{cityState='post';buildCity()});

// Orbit
canvas.addEventListener('mousedown',e=>{isDragging=true;dragStart={x:e.clientX,y:e.clientY}});
canvas.addEventListener('mouseup',()=>{isDragging=false});
canvas.addEventListener('mouseleave',()=>{isDragging=false});
canvas.addEventListener('mousemove',e=>{
  mousePx.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  if(isDragging){
    const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
    orbitTheta-=dx*.006;orbitPhi=Math.max(-1.2,Math.min(1.2,orbitPhi+dy*.005));
    dragStart={x:e.clientX,y:e.clientY};
  }
  raycaster.setFromCamera(mousePx,camera);
  const intersects=raycaster.intersectObjects(hotspotMeshes.map(h=>h.mesh));
  hovering=intersects.length>0;
  canvas.style.cursor=hovering?'pointer':(isDragging?'grabbing':'default');
  const cd=document.getElementById('cursor-dot');
  cd.style.opacity=hovering?'1':'0';
  cd.style.left=e.clientX+'px';cd.style.top=e.clientY+'px';
  cd.style.transform=hovering?'translate(-50%,-50%) scale(2)':'translate(-50%,-50%) scale(1)';
});

canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  orbitDist=Math.max(3,Math.min(80,orbitDist+e.deltaY*.02));
},{passive:false});

canvas.addEventListener('click',e=>{
  const ndc=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(hotspotMeshes.map(h=>h.mesh));
  if(!hits.length)return;
  const hit=hits[0].object;
  const hotspot=hotspotMeshes.find(h=>h.mesh===hit);
  if(hotspot){hotspot.action()}
});

// Touch support
let touchId=null,touchStartPos={x:0,y:0};
canvas.addEventListener('touchstart',e=>{
  const t=e.changedTouches[0];if(!t)return;
  touchId=t.identifier;isDragging=true;touchStartPos={x:t.clientX,y:t.clientY};
  dragStart={x:t.clientX,y:t.clientY};
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=Array.from(e.changedTouches).find(tc=>tc.identifier===touchId)||e.changedTouches[0];
  if(isDragging&&t){
    const dx=t.clientX-dragStart.x,dy=t.clientY-dragStart.y;
    orbitTheta-=dx*.006;orbitPhi=Math.max(-1.2,Math.min(1.2,orbitPhi+dy*.005));
    dragStart={x:t.clientX,y:t.clientY};
  }
  const t2=e.changedTouches[0];
  if(t2){
    mousePx.set((t2.clientX/innerWidth)*2-1,-(t2.clientY/innerHeight)*2+1);
    raycaster.setFromCamera(mousePx,camera);
    const intersects=raycaster.intersectObjects(hotspotMeshes.map(h=>h.mesh));
    hovering=intersects.length>0;
    const cd=document.getElementById('cursor-dot');
    cd.style.opacity=hovering?'1':'0';cd.style.left=t2.clientX+'px';cd.style.top=t2.clientY+'px';
    cd.style.transform=hovering?'translate(-50%,-50%) scale(2)':'translate(-50%,-50%) scale(1)';
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(e.changedTouches[0]){
    const dist=Math.hypot(e.changedTouches[0].clientX-touchStartPos.x,e.changedTouches[0].clientY-touchStartPos.y);
    if(dist<10){
      const ndc=new THREE.Vector2((e.changedTouches[0].clientX/innerWidth)*2-1,-(e.changedTouches[0].clientY/innerHeight)*2+1);
      raycaster.setFromCamera(ndc,camera);
      const hits=raycaster.intersectObjects(hotspotMeshes.map(h=>h.mesh));
      if(hits.length){const hit=hits[0].object;const hotspot=hotspotMeshes.find(h=>h.mesh===hit);if(hotspot)hotspot.action()}
    }
  }
  isDragging=false;touchId=null;
});

window.addEventListener('resize',()=>{const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)});

document.getElementById('theme-btn').addEventListener('click',()=>{
  darkMode=!darkMode;localStorage.setItem('exm_theme',darkMode?'dark':'light');
  applyTheme();buildCity();
});

buildCity();

function animate(){
  requestAnimationFrame(animate);
  updateOrbitCamera();
  const t=clock.getElapsedTime();
  pulseObjs.forEach(p=>{
    const s=1+Math.sin(t*2.5)*.15;
    p.mesh.scale.set(s,s,s);
    p.mesh.material.opacity=.3+Math.sin(t*2.2)*.15;
  });
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
