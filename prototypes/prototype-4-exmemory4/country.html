<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Italia Centrale — EXmemory v4.0</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f8f5;--fg:#1a1a16;--mid:#8a8a82;--red:#C0392B;--border:rgba(26,26,22,.12)}
html.dark{--bg:#0c0c0a;--fg:#e8e8e2;--mid:#5a5a54;--red:#C0392B;--border:rgba(232,232,226,.1)}
body{background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;overflow:hidden;transition:background .5s,color .5s}
#canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:28px 36px;z-index:20;pointer-events:none}
nav a{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mid);text-decoration:none;pointer-events:all;transition:color .2s}
nav a:hover{color:var(--red)}
nav div{display:flex;align-items:center;gap:12px}
#theme-btn{background:none;border:1px solid var(--border);color:var(--fg);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:8px 16px;cursor:pointer;pointer-events:all;transition:all .2s}
#theme-btn:hover{background:var(--fg);color:var(--bg)}
#hint{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);opacity:.7;z-index:20;pointer-events:none;text-align:center;white-space:nowrap}
#loading-bar{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-bar .label{font-size:9px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mid)}
#country-labels{position:fixed;inset:0;pointer-events:none;z-index:15}
.region-label{position:absolute;transform:translate(-50%,-50%);font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--mid);transition:color .3s,opacity .3s;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.region-label.amatrice{color:var(--red)}
.region-label.sea{opacity:.5;font-style:italic}
#cursor-dot{position:fixed;width:10px;height:10px;border-radius:50%;border:2px solid var(--red);background:transparent;pointer-events:none;z-index:100;opacity:0;transform:translate(-50%,-50%);transition:opacity .2s,transform .15s}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<nav>
  <a href="globe.html">← Globe</a>
  <div>
    <a href="city.html" id="next-link">Amatrice →</a>
    <button id="theme-btn">◐ Tema</button>
  </div>
</nav>
<div id="loading-bar"><div class="spinner"></div><div class="label">Caricamento terreno</div></div>
<div id="country-labels">
  <span class="region-label sea" id="lbl-tirreno">Mar Tirreno</span>
  <span class="region-label sea" id="lbl-adriatico">Mar Adriatico</span>
  <span class="region-label" id="lbl-toscana">Toscana</span>
  <span class="region-label" id="lbl-umbria">Umbria</span>
  <span class="region-label" id="lbl-marche">Marche</span>
  <span class="region-label" id="lbl-lazio">Lazio</span>
  <span class="region-label" id="lbl-abruzzo">Abruzzo</span>
  <span class="region-label amatrice" id="lbl-amatrice">Amatrice</span>
</div>
<div id="hint">Clicca il punto rosso · Trascina per ruotare · Scorri per zoomare</div>
<div id="cursor-dot"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.getElementById('canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,logarithmicDepthBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.polygonOffset=true;renderer.polygonOffsetFactor=-1;renderer.polygonOffsetUnits=-1;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.001,1000);
const raycaster=new THREE.Raycaster();
const clock=new THREE.Clock();

let darkMode=localStorage.getItem('exm_theme')==='dark';
let isDragging=false,dragStart={x:0,y:0};
let orbitPos=new THREE.Vector3(-1.5,6,6);
let hotspots=[],pulseMeshes=[];

const REGION_3D={
  'lbl-toscana':  new THREE.Vector3(-3.2,.35,-2.5),
  'lbl-umbria':   new THREE.Vector3(-1.2,.5,-1.2),
  'lbl-marche':   new THREE.Vector3(0.8,.4,-2.5),
  'lbl-lazio':    new THREE.Vector3(-1.8,.25,1.5),
  'lbl-abruzzo':  new THREE.Vector3(1,.35,.8),
  'lbl-adriatico':new THREE.Vector3(5.2,.01,-1.2),
  'lbl-tirreno':  new THREE.Vector3(-5.2,.01,.3),
  'lbl-amatrice': new THREE.Vector3(0,.72,0),
};

const C={
  bg:()=>darkMode?0x0c0c0a:0xf8f8f5,
  sea:()=>darkMode?0x0f0f0d:0xe8e8e2,
  mid:()=>darkMode?0x444440:0x999990,
};

document.documentElement.classList.toggle('dark',darkMode);
const th=document.getElementById('theme-btn');th.textContent=darkMode?'☀ Tema':'◐ Tema';
th.addEventListener('click',()=>{
  darkMode=!darkMode;document.documentElement.classList.toggle('dark',darkMode);
  th.textContent=darkMode?'☀ Tema':'◐ Tema';
  localStorage.setItem('exm_theme',darkMode?'dark':'light');
  document.getElementById('loading-bar').style.display='flex';
  buildCountry();
});

function setupLights(){
  scene.children.filter(c=>c.isLight).forEach(l=>scene.remove(l));
  scene.add(new THREE.AmbientLight(0xffffff,darkMode?.35:.55));
  const dir=new THREE.DirectionalLight(0xffffff,darkMode?1.4:.9);
  dir.position.set(3,5,3);scene.add(dir);
}

function addPulseRing(position,horizontal){
  const geo=new THREE.RingGeometry(.032,.046,40);
  const mat=new THREE.MeshBasicMaterial({color:0xC0392B,transparent:true,opacity:.6,side:THREE.DoubleSide,depthWrite:false});
  const ring=new THREE.Mesh(geo,mat);
  ring.position.copy(position);
  if(horizontal)ring.rotation.x=-Math.PI/2;
  else ring.lookAt(0,0,0);
  scene.add(ring);pulseMeshes.push({mesh:ring});
}

function buildCountry(){
  scene.children.forEach(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.dispose());}});
  while(scene.children.length)scene.remove(scene.children[0]);
  setups:setupLights();
  scene.background=new THREE.Color(C.bg());
  document.getElementById('country-labels').style.display='block';
  document.getElementById('loading-bar').style.display='flex';
  hotspots=[];pulseMeshes=[];window.__countryTerrain=null;

  const ZOOM=8,TILE_X=[135,136,137,138,139],TILE_Y=[93,94,95];
  const TILES=TILE_X.length*TILE_Y.length,TILE_PX=256;
  const CANVAS_W=TILE_X.length*TILE_PX,CANVAS_H=TILE_Y.length*TILE_PX;
  const SIZE_X=15,SIZE_Z=9,SEG_X=150,SEG_Z=90;
  const LOAD_TOTAL=TILES*2;

  const seaMat=new THREE.MeshStandardMaterial({color:C.sea(),roughness:1});
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(SIZE_X+4,SIZE_Z+4),seaMat);
  sea.rotation.x=-Math.PI/2;sea.position.y=-.015;scene.add(sea);

  const grid=new THREE.GridHelper(Math.max(SIZE_X,SIZE_Z),40,C.mid(),C.mid());
  grid.material.transparent=true;grid.material.opacity=darkMode?.08:.06;
  grid.position.y=.002;scene.add(grid);

  const geo=new THREE.PlaneGeometry(SIZE_X,SIZE_Z,SEG_X,SEG_Z);
  const pos=geo.attributes.position;
  const hCV=document.createElement('canvas');hCV.width=CANVAS_W;hCV.height=CANVAS_H;
  const hCtx=hCV.getContext('2d');
  const tCV=document.createElement('canvas');tCV.width=CANVAS_W;tCV.height=CANVAS_H;
  const tCtx=tCV.getContext('2d');
  let loaded=0,terrainRendered=0;

  (function proceduralFallback(){
    for(let py=0;py<CANVAS_H;py++)for(let px=0;px<CANVAS_W;px++){
      const nx=px/CANVAS_W*6,ny=py/CANVAS_H*6;
      const h=Math.sin(nx*1.3+ny*.7)*.08+Math.sin(nx*2.7-ny*1.1)*.04+Math.cos(ny*3.2)*.06;
      const v=Math.round((h+.18)/.36*230);
      hCtx.fillStyle=`rgb(${v},${v},${v})`;hCtx.fillRect(px,py,1,1);
      const green=Math.round(120+Math.sin(nx*4+ny*2)*40+Math.random()*8);
      const brown=Math.round(80+Math.sin(ny*6-nx*3)*30);
      tCtx.fillStyle=`rgb(${brown},${green},${Math.round(brown*.6)})`;tCtx.fillRect(px,py,1,1);
    }
  })();
  showTerrain();

  for(let tx=0;tx<TILE_X.length;tx++)for(let ty=0;ty<TILE_Y.length;ty++){
    const x=TILE_X[tx],y=TILE_Y[ty];
    const hImg=new Image();hImg.crossOrigin='anonymous';
    hImg.onload=()=>{hCtx.drawImage(hImg,tx*TILE_PX,ty*TILE_PX,TILE_PX,TILE_PX);loaded++;if(loaded===LOAD_TOTAL)showTerrain()};
    hImg.onerror=()=>{loaded++;if(loaded===LOAD_TOTAL)showTerrain()};
    hImg.src=`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${ZOOM}/${x}/${y}.png`;
    const tImg=new Image();tImg.crossOrigin='anonymous';
    tImg.onload=()=>{tCtx.drawImage(tImg,tx*TILE_PX,ty*TILE_PX,TILE_PX,TILE_PX);loaded++;if(loaded===LOAD_TOTAL)showTerrain()};
    tImg.onerror=()=>{loaded++;if(loaded===LOAD_TOTAL)showTerrain()};
    tImg.src=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${ZOOM}/${y}/${x}`;
  }

  function showTerrain(){
    if(++terrainRendered>2)return;
    document.getElementById('loading-bar').style.display='none';
    const hData=hCtx.getImageData(0,0,CANVAS_W,CANVAS_H);
    const elevMap=new Float32Array(CANVAS_W*CANVAS_H);
    for(let py=0;py<CANVAS_H;py++)for(let px=0;px<CANVAS_W;px++){
      const i=(py*CANVAS_W+px)*4;
      const el=(hData.data[i]*256+hData.data[i+1]+hData.data[i+2]/256)-32768;
      elevMap[py*CANVAS_W+px]=Math.max(0,el);
    }
    for(let i=0;i<pos.count;i++){
      const vx=pos.getX(i),vz=pos.getY(i);
      const px=Math.round((vx/SIZE_X+0.5)*(CANVAS_W-1));
      const py=Math.round((0.5-vz/SIZE_Z)*(CANVAS_H-1));
      const ci=Math.max(0,Math.min(CANVAS_H-1,py))*CANVAS_W+Math.max(0,Math.min(CANVAS_W-1,px));
      pos.setZ(i,Math.max(0,(elevMap[ci]||0)/2900*0.7));
    }
    pos.needsUpdate=true;geo.computeVertexNormals();
    const satTex=new THREE.CanvasTexture(tCV);
    satTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
    scene.remove(grid);
    const tMat=new THREE.MeshStandardMaterial({map:satTex,roughness:.85});
    const terrain=new THREE.Mesh(geo,tMat);terrain.rotation.x=-Math.PI/2;
    if(window.__countryTerrain)scene.remove(window.__countryTerrain);
    scene.add(terrain);window.__countryTerrain=terrain;
  }

  const hsMat=new THREE.MeshStandardMaterial({color:0xC0392B,emissive:0xC0392B,emissiveIntensity:.5,roughness:.3});
  const hs=new THREE.Mesh(new THREE.SphereGeometry(.08,16,16),hsMat);
  hs.position.set(0,.7,0);scene.add(hs);
  hotspots=[{mesh:hs}];
  addPulseRing(new THREE.Vector3(0,.71,0),true);

  camera.position.set(-1.5,6,6);camera.lookAt(0,.2,0);
  camera.fov=45;camera.updateProjectionMatrix();
  orbitPos.copy(camera.position);
}

canvas.addEventListener('mousedown',e=>{isDragging=true;dragStart={x:e.clientX,y:e.clientY};orbitPos.copy(camera.position);canvas.style.cursor='grabbing'});
canvas.addEventListener('mouseup',()=>{isDragging=false;canvas.style.cursor='default'});
canvas.addEventListener('mouseleave',()=>{isDragging=false});

canvas.addEventListener('mousemove',e=>{
  if(isDragging){
    const dx=(e.clientX-dragStart.x)*.005,dy=(e.clientY-dragStart.y)*.004;
    const r=orbitPos.length();
    let theta=Math.atan2(orbitPos.x,orbitPos.z)-dx;
    let phi=Math.acos(Math.max(-.98,Math.min(.98,orbitPos.y/r)))-dy;
    phi=Math.max(.1,Math.min(Math.PI*.82,phi));
    orbitPos.set(r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.cos(theta));
    dragStart.x=e.clientX;dragStart.y=e.clientY;
    camera.position.copy(orbitPos);camera.lookAt(0,.2,0);
  }
  const ndc=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(hotspots.map(h=>h.mesh));
  const hovering=hits.length>0;
  canvas.style.cursor=hovering?'pointer':'default';
  const cd=document.getElementById('cursor-dot');
  cd.style.opacity=hovering?'1':'0';cd.style.left=e.clientX+'px';cd.style.top=e.clientY+'px';
});

canvas.addEventListener('click',e=>{
  const ndc=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(hotspots.map(h=>h.mesh));
  if(hits.length)window.location.href='city.html';
});

canvas.addEventListener('wheel',e=>{
  const r=orbitPos.length();
  const nr=Math.max(2,Math.min(30,r+e.deltaY*.004));
  orbitPos.setLength(nr);camera.position.copy(orbitPos);camera.lookAt(0,.2,0);
});

// Touch support
let touchId=null,touchStartPos={x:0,y:0};
canvas.addEventListener('touchstart',e=>{
  const t=e.changedTouches[0];if(!t)return;
  touchId=t.identifier;isDragging=true;touchStartPos={x:t.clientX,y:t.clientY};
  dragStart={x:t.clientX,y:t.clientY};orbitPos.copy(camera.position);
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=Array.from(e.changedTouches).find(tc=>tc.identifier===touchId)||e.changedTouches[0];
  if(isDragging&&t){
    const dx=(t.clientX-dragStart.x)*.005,dy=(t.clientY-dragStart.y)*.004;
    const r=orbitPos.length();
    let theta=Math.atan2(orbitPos.x,orbitPos.z)-dx;
    let phi=Math.acos(Math.max(-.98,Math.min(.98,orbitPos.y/r)))-dy;
    phi=Math.max(.1,Math.min(Math.PI*.82,phi));
    orbitPos.set(r*Math.sin(phi)*Math.sin(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.cos(theta));
    dragStart.x=t.clientX;dragStart.y=t.clientY;
    camera.position.copy(orbitPos);camera.lookAt(0,.2,0);
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(e.changedTouches[0]){
    const dist=Math.hypot(e.changedTouches[0].clientX-touchStartPos.x,e.changedTouches[0].clientY-touchStartPos.y);
    if(dist<10){
      const ndc=new THREE.Vector2((e.changedTouches[0].clientX/innerWidth)*2-1,-(e.changedTouches[0].clientY/innerHeight)*2+1);
      raycaster.setFromCamera(ndc,camera);const cd=document.getElementById('cursor-dot');
      const hits=raycaster.intersectObjects(hotspots.map(h=>h.mesh));
      if(hits.length)window.location.href='city.html';
    }
  }
  isDragging=false;touchId=null;
});

function updateLabels(){
  const v=new THREE.Vector3();
  Object.entries(REGION_3D).forEach(([id,pos3])=>{
    const el=document.getElementById(id);if(!el)return;
    v.copy(pos3);v.project(camera);
    el.style.left=((v.x*.5+.5)*innerWidth)+'px';
    el.style.top=((-.5*v.y+.5)*innerHeight)+'px';
    el.style.display=(v.z<1)?'block':'none';
  });
}

window.addEventListener('resize',()=>{
  const w=innerWidth,h=innerHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);
});

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  pulseMeshes.forEach(p=>{
    const scale=1+Math.sin(t*2.5)*.15;
    p.mesh.scale.set(scale,scale,scale);
    p.mesh.material.opacity=.3+Math.sin(t*2.2)*.15;
  });
  updateLabels();
  renderer.render(scene,camera);
}

buildCountry();
animate();
</script>
</body>
</html>
