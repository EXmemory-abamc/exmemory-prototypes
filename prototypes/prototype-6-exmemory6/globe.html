<script type="module">
import * as THREE from 'three';

// ================================================================
// Config
// ================================================================
const ITALY_POS = (() => {
  const lon = 13.29, lat = 42.63;
  const phi = ((lon + 180) / 360) * Math.PI * 2;
  const theta = (1 - (90 + lat) / 180) * Math.PI;
  return new THREE.Vector3(
    -Math.sin(theta) * Math.cos(phi),
    Math.cos(theta),
    Math.sin(theta) * Math.sin(phi)
  ).multiplyScalar(1.01);
})();

// ================================================================
// Three.js setup
// ================================================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050505);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
const raycaster = new THREE.Raycaster();

// Camera orbital
let theta = 0.5, phi = 0.3, radius = 2.6;
let targetTheta = theta, targetPhi = phi;
let centerTheta = theta, centerPhi = phi;
let mouseX = 0, mouseY = 0;
let isDragging = false, dragStartX, dragStartY, dragStartTheta, dragStartPhi;

function updateCamera() {
  camera.position.x = radius * Math.sin(theta) * Math.cos(phi);
  camera.position.y = radius * Math.sin(phi);
  camera.position.z = radius * Math.cos(theta) * Math.cos(phi);
  camera.lookAt(0, 0, 0);
}

// ================================================================
// Build globe
// ================================================================
const loader = new THREE.TextureLoader();
let globeGroup = new THREE.Group();
let hotspotMeshes = [];
let pulseObjs = [];
let hotspotRingOuter = null;

function buildGlobe() {
  while (scene.children.length) scene.remove(scene.children[0]);
  globeGroup = new THREE.Group();
  hotspotMeshes = [];
  pulseObjs = [];

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const dir = new THREE.DirectionalLight(0xffffff, 0.8);
  dir.position.set(5, 10, 7);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x6688cc, 0.25);
  dir2.position.set(-5, -3, -5);
  scene.add(dir2);

  // Globe sphere
  const satTex = loader.load('https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg');
  const topoTex = loader.load('https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png');
  const geo = new THREE.SphereGeometry(1, 64, 64);
  const mat = new THREE.MeshPhongMaterial({
    map: satTex,
    bumpMap: topoTex,
    bumpScale: 0.03,
    specular: new THREE.Color(0x111111),
    shininess: 10
  });
  const globe = new THREE.Mesh(geo, mat);
  globeGroup.add(globe);

  // Atmosphere glow
  const glowMat = new THREE.MeshPhongMaterial({
    color: 0x88bbff,
    transparent: true,
    opacity: 0.1,
    side: THREE.BackSide
  });
  globeGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.04, 48, 48), glowMat));

  // Italy hotspot — inner dot (amber/percettivo color matching reference)
  const sphereGeo = new THREE.SphereGeometry(0.025, 16, 16);
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0xFBBF24 });
  const hotspot = new THREE.Mesh(sphereGeo, sphereMat);
  hotspot.position.copy(ITALY_POS);
  hotspot.userData = { type: 'italy' };
  globeGroup.add(hotspot);
  hotspotMeshes.push(hotspot);

  // Hotspot ring — inner pulse
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xFBBF24, transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false });
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.035, 0.055, 32), ringMat);
  ring.position.copy(ITALY_POS);
  ring.lookAt(0, 0, 0);
  globeGroup.add(ring);
  pulseObjs.push({ mesh: ring });

  // Hotspot ring — outer animated ring (matches the circle in the reference image)
  const outerRingMat = new THREE.MeshBasicMaterial({ color: 0xFBBF24, transparent: true, opacity: 0.2, side: THREE.DoubleSide, depthWrite: false });
  hotspotRingOuter = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.085, 48), outerRingMat);
  hotspotRingOuter.position.copy(ITALY_POS);
  hotspotRingOuter.lookAt(0, 0, 0);
  globeGroup.add(hotspotRingOuter);

  // Scattered memory nodes (subtle dots across the globe surface)
  const nodeColors = [0x4ADE80, 0xFBBF24, 0x60A5FA, 0xE15B5B, 0x9F75E3, 0x59B185];
  for (let i = 0; i < 80; i++) {
    const u = Math.random() * Math.PI * 2;
    const v = Math.acos(2 * Math.random() - 1);
    const r2 = 1.008;
    const pos = new THREE.Vector3(
      r2 * Math.sin(v) * Math.cos(u),
      r2 * Math.cos(v),
      r2 * Math.sin(v) * Math.sin(u)
    );
    const dotSize = 0.004 + Math.random() * 0.008;
    const dotMat = new THREE.MeshBasicMaterial({
      color: nodeColors[Math.floor(Math.random() * nodeColors.length)],
      transparent: true,
      opacity: 0.3 + Math.random() * 0.5
    });
    const dot = new THREE.Mesh(new THREE.SphereGeometry(dotSize, 8, 8), dotMat);
    dot.position.copy(pos);
    globeGroup.add(dot);
  }

  // Starfield
  const starGeo = new THREE.BufferGeometry();
  const starCount = 600;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount * 3; i++) starPos[i] = (Math.random() - 0.5) * 200;
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat2 = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.6 });
  scene.add(new THREE.Points(starGeo, starMat2));

  // Faint grid lines on the globe (latitude/longitude hints)
  const gridMat = new THREE.LineBasicMaterial({ color: 0x334455, transparent: true, opacity: 0.08 });
  for (let lat = -60; lat <= 60; lat += 30) {
    const pts = [];
    const latRad = (lat * Math.PI) / 180;
    for (let lon = 0; lon <= 360; lon += 5) {
      const lonRad = (lon * Math.PI) / 180;
      pts.push(new THREE.Vector3(
        1.002 * Math.cos(latRad) * Math.cos(lonRad),
        1.002 * Math.sin(latRad),
        1.002 * Math.cos(latRad) * Math.sin(lonRad)
      ));
    }
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
    globeGroup.add(new THREE.Line(lineGeo, gridMat));
  }

  scene.add(globeGroup);
  updateCamera();
}

// ================================================================
// Hotspot card visibility
// ================================================================
const hotspotCard = document.getElementById('hotspot-card');
let isHotspotHovered = false;

function showHotspotCard() {
  hotspotCard.classList.add('visible');
}
function hideHotspotCard() {
  hotspotCard.classList.remove('visible');
}

// Show card by default after a brief delay (the hotspot is always in view)
setTimeout(showHotspotCard, 1800);

// ================================================================
// Filter interaction (cosmetic)
// ================================================================
document.querySelectorAll('.filter-item[data-filter]').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.filter-item[data-filter]').forEach(f => f.classList.remove('active'));
    item.classList.add('active');
  });
});

// ================================================================
// Recenter button
// ================================================================
document.getElementById('btn-recenter').addEventListener('click', () => {
  targetTheta = 0.5;
  targetPhi = 0.3;
  centerTheta = 0.5;
  centerPhi = 0.3;
  radius = 2.6;
});

// ================================================================
// Controls — Parallax hover + drag orbit
// ================================================================
canvas.addEventListener('mousemove', e => {
  const ndcX = (e.clientX / innerWidth) * 2 - 1;
  const ndcY = -(e.clientY / innerHeight) * 2 + 1;

  if (isDragging) {
    theta = dragStartTheta - (e.clientX - dragStartX) * 0.005;
    phi = Math.max(-0.3, Math.min(1.3, dragStartPhi + (e.clientY - dragStartY) * 0.004));
    updateCamera();
  }

  if (!isDragging) {
    targetTheta = centerTheta + ndcX * 0.25;
    targetPhi = centerPhi - ndcY * 0.15;
    targetPhi = Math.max(-0.3, Math.min(1.3, targetPhi));
  }

  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragStartTheta = theta;
  dragStartPhi = phi;
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('mouseup', () => {
  isDragging = false;
  targetTheta = theta; targetPhi = phi;
  centerTheta = theta; centerPhi = phi;
  canvas.style.cursor = 'default';
});
canvas.addEventListener('mouseleave', () => {
  isDragging = false;
  targetTheta = theta; targetPhi = phi;
  centerTheta = theta; centerPhi = phi;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  radius = Math.max(1.5, Math.min(8, radius + e.deltaY * 0.005));
}, { passive: false });

// Click Italy hotspot
canvas.addEventListener('click', e => {
  const ndc = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(hotspotMeshes);
  if (hits.length && hits[0].object.userData.type === 'italy') {
    window.location.href = 'country.html';
  }
});

// Resize
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================================================================
// Animation
// ================================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  // Parallax smooth interpolation
  if (!isDragging) {
    theta += (targetTheta - theta) * 0.025;
    phi += (targetPhi - phi) * 0.025;
    updateCamera();
  }

  const t = clock.getElapsedTime();

  // Pulse rings
  pulseObjs.forEach(p => {
    const s = 1 + Math.sin(t * 2.5) * 0.2;
    p.mesh.scale.set(s, s, s);
    p.mesh.material.opacity = 0.3 + Math.sin(t * 2.2) * 0.15;
  });

  // Outer ring breathe animation
  if (hotspotRingOuter) {
    const os = 1 + Math.sin(t * 1.2) * 0.25;
    hotspotRingOuter.scale.set(os, os, os);
    hotspotRingOuter.material.opacity = 0.12 + Math.sin(t * 1.5) * 0.08;
  }

  // Cursor dot hover detection
  const ndc = new THREE.Vector2((mouseX / innerWidth) * 2 - 1, -(mouseY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(hotspotMeshes);
  const cd = document.getElementById('cursor-dot');
  const hovering = hits.length > 0;
  cd.style.opacity = hovering ? '1' : '0';
  cd.style.left = mouseX + 'px';
  cd.style.top = mouseY + 'px';

  if (hovering) {
    cd.style.transform = 'translate(-50%,-50%) scale(1.8)';
    canvas.style.cursor = 'pointer';
  } else {
    cd.style.transform = 'translate(-50%,-50%) scale(1)';
    if (!isDragging) canvas.style.cursor = 'default';
  }

  renderer.render(scene, camera);
}

// ================================================================
// Init
// ================================================================
buildGlobe();
animate();
</script>
</body>
</html>
